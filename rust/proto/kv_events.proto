syntax = "proto3";
package vllm;

service KvEvents {
  // Streams the KV cache events of one data-parallel rank.
  //
  // The first response is `start`; every later response is a `batch`. Batches
  // arrive in sequence-number order without gaps or duplicates. A stream whose
  // first batch has sequence number 0 carries every event since the engine
  // started; any other stream begins with the oldest batch the server retains.
  //
  // Each batch is one message, however large. A step that reports the whole
  // prefix of long requests (`kv_cache_report_mode=full`) can exceed the 4 MiB
  // that gRPC clients accept by default, so raise the client's receive limit.
  // A client that rejects a batch for its size will meet it again on every new
  // subscription until the server no longer retains it.
  //
  // INVALID_ARGUMENT: `data_parallel_rank` is unset on a server with several
  // ranks, or names a rank the server is not connected to.
  //
  // FAILED_PRECONDITION: the engine does not publish KV cache events.
  //
  // OUT_OF_RANGE: `resume` names another stream, batches no longer retained,
  // or batches not yet published. Subscribe again without `resume` and rebuild.
  //
  // DATA_LOSS: batches were lost or this subscriber fell behind the retained
  // history. Discard the state built from this stream and subscribe again
  // without `resume`.
  //
  // UNAVAILABLE: the engine's event publisher is unreachable or the server is
  // shutting down.
  rpc SubscribeKvEvents (SubscribeKvEventsRequest) returns (stream SubscribeKvEventsResponse) {}
}

message SubscribeKvEventsRequest {
  // Rank to follow; `Control.GetKvEventSources` lists the ranks that publish
  // events. May be unset when the server has a single rank.
  optional uint32 data_parallel_rank = 1;
  // Continue an earlier stream after a reconnect. Unset starts from the oldest
  // retained batch.
  optional KvEventCursor resume = 2;
}

// A position in one rank's event stream.
message KvEventCursor {
  // `KvEventStreamStart.stream_id` of the stream being continued.
  string stream_id = 1;
  // Sequence number of the first batch not yet applied.
  uint64 next_sequence_number = 2;
}

message SubscribeKvEventsResponse {
  oneof item {
    KvEventStreamStart start = 1;
    KvEventBatch batch = 2;
  }
}

message KvEventStreamStart {
  // Identifies an unbroken run of batches. It changes when the server restarts
  // and whenever batches are lost, so a cursor is only valid for the stream
  // that issued it.
  string stream_id = 1;
  uint32 data_parallel_rank = 2;
}

// The events of one scheduler step.
message KvEventBatch {
  // The engine's per-rank batch counter, starting at 0.
  uint64 sequence_number = 1;
  // Engine wall-clock time of the batch, in seconds since the Unix epoch.
  double timestamp = 2;
  repeated KvCacheEvent events = 3;
}

message KvCacheEvent {
  oneof event {
    KvBlocksStored stored = 1;
    KvBlocksRemoved removed = 2;
    KvAllBlocksCleared cleared = 3;
  }
}

// Where a block lives relative to the engine that published the event.
enum KvBlockLocality {
  KV_BLOCK_LOCALITY_UNSPECIFIED = 0;
  KV_BLOCK_LOCALITY_LOCAL = 1;
  KV_BLOCK_LOCALITY_REMOTE = 2;
}

// Blocks of one sequence became available in a storage tier, in sequence
// order. They are consecutive, each the parent of the next, only when
// `token_ids` holds exactly `block_size` tokens for each of them.
message KvBlocksStored {
  // Prefix-cache hash of each block. A publisher of 64-bit integer hashes sends
  // each as its 8 big-endian bytes; under `VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES`
  // those are the trailing 8 bytes of the digest.
  repeated bytes block_hashes = 1;
  // Hash of the block before the range `token_ids` covers. Unset for the first
  // block of a sequence, and when the publisher does not report it.
  optional bytes parent_block_hash = 2;
  // Tokens of the stored range, `block_size` per block. The range can include
  // blocks missing from `block_hashes`, and events from offloading tiers may
  // carry no tokens at all.
  repeated uint32 token_ids = 3;
  // Tokens per block; 0 when the publisher does not report it.
  uint32 block_size = 4;
  // Storage tier holding the blocks: "GPU", "CPU", "STORAGE", or a
  // connector-defined name.
  optional string medium = 5;
  optional string lora_name = 6;
  // Inputs to each block's hash other than its tokens, one entry per block in
  // `block_hashes`; the entry of a block without any has no keys. Empty when
  // the publisher does not report them.
  repeated KvBlockExtraKeys extra_keys = 7;
  // KV cache group of the blocks, with the cache spec of that group.
  optional uint32 group_idx = 8;
  optional string kv_cache_spec_kind = 9;
  optional uint32 kv_cache_spec_sliding_window = 10;
  KvBlockLocality locality = 11;
  // Secondary offloading tier that produced the event, if any.
  optional string ownership = 12;
  // Session whose request triggered this store or reuse report. The blocks
  // may be shared with other sessions.
  optional string session_id = 13;
  // Tokens after each block that its hash also covers, one entry per block.
  // Empty when lookahead hashing is disabled.
  repeated KvLookaheadTokenIds lookahead_token_ids = 14;
}

message KvBlockExtraKeys {
  repeated KvBlockExtraKey keys = 1;
}

message KvBlockExtraKey {
  oneof key {
    // LoRA name or cache salt.
    string text = 1;
    // Digest of the block's prompt embeddings.
    bytes digest = 2;
    KvMultimodalKey multimodal = 3;
  }
}

// A multimodal item that overlaps the block.
message KvMultimodalKey {
  string identifier = 1;
  // Start of the item relative to the first token of the block; negative when
  // the item starts in an earlier block.
  int64 offset = 2;
}

message KvLookaheadTokenIds {
  repeated uint32 token_ids = 1;
}

message KvBlocksRemoved {
  repeated bytes block_hashes = 1;
  optional string medium = 2;
  optional uint32 group_idx = 3;
  KvBlockLocality locality = 4;
  optional string ownership = 5;
}

// A block pool of the engine dropped all its blocks. The event does not name
// the pool or its tier, and blocks held elsewhere, such as by an offloading
// connector, may remain.
message KvAllBlocksCleared {}
